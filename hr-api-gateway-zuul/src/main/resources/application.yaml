spring:
  application:
    name: hr-api-gateway

  cloud:
    gateway:
      routes:
        - id: worker
          uri: lb://HR-WORKER
          predicates:
            - Path=/hr-worker/**
          filters:
            - StripPrefix=1

        - id: payroll
          uri: lb://HR-PAYROLL
          predicates:
            - Path=/hr-payroll/**
          filters:
            - StripPrefix=1

        - id: user
          uri: lb://HR-USER
          predicates:
            - Path=/hr-user/**
          filters:
            - StripPrefix=1

server:
  port: 8765

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
